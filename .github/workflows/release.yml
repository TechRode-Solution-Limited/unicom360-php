name: Release

# Runs on a version tag. Packagist picks the tag up by itself through its GitHub hook: this
# workflow only tests the tagged commit and creates the GitHub Release from the CHANGELOG.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  release:
    name: GitHub Release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against Client::VERSION and the CHANGELOG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "public const VERSION = '${version}';" src/Client.php \
            || { echo "Client::VERSION is not ${version}"; exit 1; }
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q "^## \[${version}\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}" CHANGELOG.md; then
            echo "CHANGELOG.md needs a dated section: ## [${version}] - YYYY-MM-DD"
            exit 1
          fi
          test -s release-notes.md || { echo "The CHANGELOG section for ${version} is empty"; exit 1; }
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
